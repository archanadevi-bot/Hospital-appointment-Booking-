<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Appointment Booking</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Reset some defaults */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
    }

    /* Hero section */
    .hero {
      background: url('852d3ae66e2f216bcc1e074c7e0da8da.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      color: #ffffff;
    }

    /* Overlay for readability */
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5); /* dark overlay */
      z-index: 1;
    }

    /* Content inside hero */
    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    .hero nav a {
      display: inline-block;
      margin: 10px 20px;
      padding: 12px 30px;
      background-color: #007BFF;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }

    .hero nav a:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <h1>Hospital Appointment Booking</h1>
      <nav>
        <a href="doctors.html">View Doctors</a>
        <a href="booking.html">Book Appointment</a>
      </nav>
    </div>
  </div>
</body>
</html>
