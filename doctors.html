<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctors List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>Available Doctors</h2>
  <div class="doctor-grid" id="doctorList"></div>
  <a href="booking.html">Book Appointment</a>

  <script src="js/app.js"></script>
  <script>
    const doctorList = document.getElementById('doctorList');

    doctors.forEach(doc => {
      const card = document.createElement('div');
      card.className = 'doctor-card';
      card.innerHTML = `
        <h3>${doc.name}</h3>
        <span class="specialty">${doc.specialty}</span>
        <button onclick="prefillBooking(${doc.id})">Book Appointment</button>
      `;
      doctorList.appendChild(card);
    });

    function prefillBooking(id) {
      localStorage.setItem('prefillDoctor', id);
      window.location.href = 'booking.html';
    }
  </script>
</body>
</html>
