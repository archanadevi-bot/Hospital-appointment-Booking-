services:
  hospital-booking-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-booking:latest
    container_name: hospital-booking-app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge

